<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>K-ID API Tester - Patient + Organisation</title>
<script src="https://cdn.tailwindcss.com"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
html,body{height:100%} body{font-family:Inter,system-ui,sans-serif} 
*{scrollbar-width:thin; scrollbar-color:#333 transparent}
::-webkit-scrollbar{width:6px;height:6px} ::-webkit-scrollbar-thumb{background:#333;border-radius:3px} ::-webkit-scrollbar-track{background:transparent}
</style>
</head><body class="bg-black text-white min-h-screen">
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect}=React;
const ENDPOINTS=[
 {g:"Patient Auth",items:[
  {id:"preg",m:"POST",p:"/api/patient/register",role:null,fields:[{k:"first_name",v:"Amara"},{k:"last_name",v:"Okafor"},{k:"phone",v:"08012345678"},{k:"email",v:"amara@email.com"},{k:"date_of_birth",v:"2001-03-15"},{k:"password",v:"password123"}]},
  {id:"plog",m:"POST",p:"/api/patient/login",role:null,fields:[{k:"email",v:"amara@email.com"},{k:"password",v:"password123"}]},
  {id:"pme",m:"GET",p:"/api/patient/profile",role:"patient",fields:[]},
  {id:"ppatch",m:"PATCH",p:"/api/patient/profile",role:"patient",fields:[{k:"first_name",v:"Amara"},{k:"last_name",v:"Okafor"},{k:"email",v:"new@email.com"}]},
 ]},
 {g:"Patient Records & Requests",items:[
  {id:"prec",m:"GET",p:"/api/patient/records",role:"patient",fields:[]},
  {id:"prec1",m:"GET",p:"/api/patient/records/1",role:"patient",fields:[],path:"/api/patient/records/1"},
  {id:"preq",m:"GET",p:"/api/patient/requests",role:"patient",q:"?status=pending&type=organisation",fields:[]},
  {id:"papprove",m:"POST",p:"/api/patient/requests/:id/approve",role:"patient",fields:[],path:"/api/patient/requests/1/approve",desc:"Generates QR 10min + organisation_access"},
  {id:"pdecline",m:"POST",p:"/api/patient/requests/:id/decline",role:"patient",fields:[],path:"/api/patient/requests/1/decline"},
  {id:"pqr",m:"GET",p:"/api/patient/qr/:requestId",role:"patient",fields:[],path:"/api/patient/qr/1"},
  {id:"pscan",m:"POST",p:"/api/qr/scan",role:"provider|organisation",fields:[{k:"qr_token",v:"PASTE_TOKEN_HERE"}],desc:"Marks used BEFORE returning record"},
  {id:"pact",m:"GET",p:"/api/patient/activity?limit=20",role:"patient",fields:[]},
  {id:"pnotif",m:"GET",p:"/api/patient/notifications",role:"patient",fields:[]},
  {id:"pnotifr",m:"PATCH",p:"/api/patient/notifications/read-all",role:"patient",fields:[]},
  {id:"pdash",m:"GET",p:"/api/patient/dashboard",role:"patient",fields:[]},
  {id:"porgs",m:"GET",p:"/api/patient/organisations",role:"patient",fields:[]},
  {id:"prevoke",m:"DELETE",p:"/api/patient/organisations/:orgId/revoke",role:"patient",fields:[],path:"/api/patient/organisations/1/revoke",desc:"Invalidates QR codes immediately"},
 ]},
 {g:"Provider (to send records)",items:[
  {id:"proreg",m:"POST",p:"/api/provider/register",role:null,fields:[{k:"provider_name",v:"Helix Lab"},{k:"license_number",v:"LIC-999"},{k:"email",v:"lab@test.ng"},{k:"phone",v:"08000000011"},{k:"password",v:"password123"}]},
  {id:"prolog",m:"POST",p:"/api/provider/login",role:null,fields:[{k:"email",v:"lab@helixbiogen.ng"},{k:"password",v:"password123"}]},
  {id:"prosend",m:"POST",p:"/api/provider/records",role:"provider",fields:[{k:"kid_number",v:"KID-20260001"},{k:"record_type",v:"Blood Test Result"},{k:"issued_by",v:"Helix Biogen Institute"},{k:"summary",v:"All normal"},{k:"details",v:"Hb 14.2"}]},
  {id:"proreq",m:"POST",p:"/api/provider/requests",role:"provider",fields:[{k:"kid_number",v:"KID-20260001"},{k:"record_type",v:"Vaccination History"},{k:"reason",v:"Check"}]},
 ]},
 {g:"Organisation",items:[
  {id:"oreg",m:"POST",p:"/api/org/register",role:null,fields:[{k:"org_name",v:"Test School"},{k:"org_type",v:"school"},{k:"cac_number",v:"CAC/IT/999999"},{k:"authorised_person",v:"Dr. Test"},{k:"email",v:"testschool@test.ng"},{k:"phone",v:"08012345678"},{k:"password",v:"password123"}]},
  {id:"olog",m:"POST",p:"/api/org/login",role:null,fields:[{k:"email",v:"studentaffairs@lautech.edu.ng"},{k:"password",v:"password123"}]},
  {id:"ome",m:"GET",p:"/api/org/me",role:"organisation",fields:[]},
  {id:"osearch",m:"GET",p:"/api/org/patients/search?kid=KID-20260001",role:"organisation",verified:true,q:"?kid=KID-20260001",fields:[],desc:"Only returns first_name, last_name, kid_number"},
  {id:"oreqsend",m:"POST",p:"/api/org/requests",role:"organisation",verified:true,fields:[{k:"kid_number",v:"KID-20260001"},{k:"record_type",v:"Vaccination History"},{k:"reason",v:"Student clearance"}]},
  {id:"oreqlist",m:"GET",p:"/api/org/requests?status=pending",role:"organisation",verified:true,q:"?status=pending",fields:[]},
  {id:"orecord",m:"GET",p:"/api/org/requests/:id/record",role:"organisation",verified:true,path:"/api/org/requests/1/record",desc:"Checks BOTH request status AND organisation_access"},
  {id:"odash",m:"GET",p:"/api/org/dashboard",role:"organisation",verified:true,fields:[]},
 ]},
];

function App(){
 const [base,setBase]=useState(localStorage.getItem('kid_base')||'https://kid-backend.onrender.com');
 const [orgTok,setOrgTok]=useState(localStorage.getItem('orgTok')||'');
 const [patTok,setPatTok]=useState(localStorage.getItem('patTok')||'');
 const [provTok,setProvTok]=useState(localStorage.getItem('provTok')||'');
 const [sel,setSel]=useState(ENDPOINTS[0].items[1]);
 const [form,setForm]=useState({}); const [pathInput,setPathInput]=useState(''); const [query,setQuery]=useState('');
 const [resp,setResp]=useState(null); const [loading,setLoading]=useState(false); const [health,setHealth]=useState(null);
 useEffect(()=>{ localStorage.setItem('kid_base',base); },[base]);
 useEffect(()=>{ if(sel){ const init={}; (sel.fields||[]).forEach(f=>init[f.k]=f.v); setForm(init); setPathInput(sel.path||sel.p); setQuery(sel.q||''); } },[sel]);
 const getTokenFor=(role)=>{ if(role?.includes('organisation')) return orgTok; if(role?.includes('patient')) return patTok; if(role?.includes('provider')) return provTok; if(orgTok) return orgTok; if(patTok) return patTok; if(provTok) return provTok; return ''; };
 const doFetch=async()=>{
  setLoading(true); setResp(null);
  try{
   let url=base.replace(/\/$/,'')+(pathInput.startsWith('/api')?pathInput:sel.p)+(query||'');
   if(url.includes(':id') && form.id) url=url.replace(':id',form.id);
   const m=sel.m;
   const headers={"Content-Type":"application/json"};
   const tok=getTokenFor(sel.role);
   if(tok) headers["Authorization"]=`Bearer ${tok}`;
   let body=null;
   if(['POST','PATCH'].includes(m)) body=JSON.stringify(form);
   const r=await fetch(url,{method:m,headers,body});
   const text=await r.text(); let json; try{json=JSON.parse(text)}catch{json={raw:text}};
   setResp({status:r.status,ok:r.ok,json,url});
   if(json?.data?.token){
    if(json.data.organisation || url.includes('/org/login')) { setOrgTok(json.data.token); localStorage.setItem('orgTok',json.data.token); }
    else if(json.data.patient) { setPatTok(json.data.token); localStorage.setItem('patTok',json.data.token); }
    else if(json.data.provider) { setProvTok(json.data.token); localStorage.setItem('provTok',json.data.token); }
   }
  }catch(e){ setResp({status:0,ok:false,json:{error:e.message}}); }
  setLoading(false);
 };
 const checkHealth=async()=>{ try{ const r=await fetch(base.replace(/\/$/,'')+'/health'); const j=await r.json(); setHealth(j);}catch(e){ setHealth({success:false,message:e.message}); } };
 return (
 <div className="min-h-screen flex flex-col">
  {/* Header - sticky, no overflow issues */}
  <div className="sticky top-0 z-20 border-b border-zinc-800 p-3 flex flex-wrap gap-3 items-center bg-zinc-900">
   <div className="font-bold text-lg shrink-0">K-ID <span className="text-green-400">Patient+Org</span> Tester</div>
   <input value={base} onChange={e=>setBase(e.target.value)} className="bg-black border border-zinc-700 rounded px-3 py-1.5 text-sm w-64 md:w-72 shrink-0" placeholder="Base URL"/>
   <button onClick={checkHealth} className="bg-white text-black px-3 py-1.5 rounded text-sm font-medium shrink-0">Health</button>
   <div className="flex flex-wrap gap-2 items-center">
    <span className="text-xs px-2 py-1 rounded bg-zinc-800 truncate max-w-[140px]">Org: {orgTok? '✓ '+orgTok.slice(-8):'—'}</span>
    <span className="text-xs px-2 py-1 rounded bg-zinc-800 truncate max-w-[140px]">Pat: {patTok? '✓ '+patTok.slice(-8):'—'}</span>
    <span className="text-xs px-2 py-1 rounded bg-zinc-800 truncate max-w-[140px]">Prov: {provTok? '✓ '+provTok.slice(-8):'—'}</span>
    {health && <span className={`text-xs px-2 py-1 rounded ${health.success?'bg-green-900 text-green-300':'bg-red-900 text-red-300'}`}>{health.success?'API OK':'ERR'}</span>}
   </div>
   <button onClick={()=>{localStorage.clear(); setOrgTok(''); setPatTok(''); setProvTok(''); setHealth(null);}} className="ml-auto text-xs text-zinc-400 underline shrink-0">Clear</button>
  </div>

  {/* Main - responsive, no h-screen + overflow-hidden trap */}
  <div className="flex-1 flex flex-col lg:flex-row min-h-0">
   {/* Sidebar - scrolls independently, sticky on desktop */}
   <div className="w-full lg:w-72 lg:shrink-0 border-b lg:border-b-0 lg:border-r border-zinc-800 bg-zinc-900/50 lg:sticky lg:top-[56px] lg:h-[calc(100vh-56px)] lg:overflow-y-auto p-2 space-y-4">
    <div className="lg:hidden grid grid-cols-2 gap-2">
     {ENDPOINTS.flatMap(g=>g.items).map(it=>(
      <button key={it.id+'-m'} onClick={()=>setSel(it)} className={`text-left px-2 py-1.5 rounded text-xs flex items-center gap-1.5 ${sel.id===it.id?'bg-white text-black':'bg-zinc-800 text-zinc-300'}`}>
       <span className={`text-[9px] px-1 rounded font-bold ${it.m==='GET'?'bg-green-600':it.m==='POST'?'bg-blue-600':it.m==='DELETE'?'bg-red-600':'bg-yellow-600'} text-white`}>{it.m}</span>
       <span className="truncate">{it.p.split('/').pop().slice(0,18)}</span>
      </button>
     ))}
    </div>
    <div className="hidden lg:block space-y-4">
    {ENDPOINTS.map(g=>(
     <div key={g.g}><div className="text-[11px] tracking-widest text-zinc-500 uppercase font-semibold mb-2 sticky top-0 bg-zinc-900/50 backdrop-blur py-1">{g.g}</div>
      <div className="space-y-1">{g.items.map(it=>(
       <button key={it.id} onClick={()=>setSel(it)} className={`w-full text-left px-2 py-1.5 rounded text-sm flex items-center gap-2 ${sel.id===it.id?'bg-white text-black':'hover:bg-zinc-800 text-zinc-300'}`}>
        <span className={`text-[10px] px-1 rounded font-bold ${it.m==='GET'?'bg-green-600 text-white':it.m==='POST'?'bg-blue-600 text-white':it.m==='DELETE'?'bg-red-600 text-white':'bg-yellow-600 text-black'}`}>{it.m}</span>
        <span className="truncate">{it.p.replace('/api/','')}</span>
       </button>
      ))}</div>
     </div>
    ))}
    <div className="pt-4 border-t border-zinc-800 text-[11px] text-zinc-500">Seed: amara@email.com / studentaffairs@lautech.edu.ng / lab@helixbiogen.ng / pwd: password123<br/>KID-20260001<br/><br/>Tip: Login Patient → Org search → Send req → Approve → View record</div>
    </div>
   </div>

   {/* Middle + Right - stack on mobile, side-by-side on desktop, both scroll */}
   <div className="flex-1 flex flex-col xl:flex-row min-w-0">
    {/* Request panel */}
    <div className="w-full xl:w-1/2 xl:border-r border-zinc-800 p-4 space-y-4 xl:overflow-y-auto xl:h-[calc(100vh-56px)] xl:sticky xl:top-[56px] min-w-0">
     <div className="flex flex-wrap items-center gap-2 min-w-0">
      <span className={`px-2 py-1 rounded text-xs font-bold shrink-0 ${sel.m==='GET'?'bg-green-600':sel.m==='POST'?'bg-blue-600':sel.m==='DELETE'?'bg-red-600':'bg-yellow-600'}`}>{sel.m}</span>
      <input value={pathInput} onChange={e=>setPathInput(e.target.value)} className="flex-1 min-w-0 bg-zinc-900 border border-zinc-700 rounded px-2 py-1 text-sm font-mono"/>
      <span className="text-xs text-zinc-500 shrink-0">{sel.role||'public'}</span>
      {sel.verified&&<span className="text-xs bg-orange-900 text-orange-300 px-2 py-0.5 rounded shrink-0">VERIFIED</span>}
     </div>
     {sel.desc && <div className="text-xs bg-amber-950/50 border border-amber-900/50 rounded p-2 text-amber-300 break-words">{sel.desc}</div>}
     <input value={query} onChange={e=>setQuery(e.target.value)} placeholder="Query e.g. ?kid=KID-20260001 or ?status=pending" className="w-full bg-black border border-zinc-700 rounded px-2 py-1.5 text-sm font-mono min-w-0"/>
     {sel.fields.length>0 && <div className="space-y-2">{sel.fields.map(f=><div key={f.k}><label className="text-xs text-zinc-400 break-all">{f.k}</label><input value={form[f.k]||''} onChange={e=>setForm({...form,[f.k]:e.target.value})} className="w-full bg-black border border-zinc-700 rounded px-2 py-1.5 text-sm mt-1 min-w-0"/></div>)}</div>}
     <button onClick={doFetch} disabled={loading} className="w-full bg-green-500 hover:bg-green-400 text-black font-bold py-2.5 rounded disabled:opacity-50 sticky bottom-2 z-10">{loading?'Sending...':'Execute →'}</button>
     <div className="text-xs text-zinc-500 font-mono bg-black border border-zinc-800 rounded p-2 overflow-x-auto whitespace-pre-wrap break-all">curl -X {sel.m} "{base.replace(/\/$/,'')}{pathInput}{query}" {getTokenFor(sel.role)?`-H "Authorization: Bearer ...${getTokenFor(sel.role).slice(-12)}"`:""} {['POST','PATCH'].includes(sel.m)?`-d '${JSON.stringify(form)}'`:''}</div>
    </div>
    {/* Response panel */}
    <div className="w-full xl:w-1/2 p-4 bg-black xl:overflow-y-auto xl:h-[calc(100vh-56px)] xl:sticky xl:top-[56px] min-w-0 border-t xl:border-t-0 border-zinc-800">
     {!resp && <div className="text-zinc-600 text-sm mt-10 text-center p-8 border border-dashed border-zinc-800 rounded">Response will appear here<br/><br/>Quick start:<br/>1. Health check<br/>2. Patient Login (amara@email.com)<br/>3. Org Login (studentaffairs@...)<br/>4. Search → Request → Approve → View</div>}
     {resp && <>
      <div className="flex flex-wrap gap-2 items-center mb-2">
       <span className={`px-2 py-1 rounded text-xs font-bold ${resp.ok?'bg-green-900 text-green-300':'bg-red-900 text-red-300'}`}>HTTP {resp.status} {resp.ok?'OK':'ERROR'}</span>
       <span className="text-xs text-zinc-500 truncate">{resp.url||''}</span>
      </div>
      <pre className="bg-zinc-900 border border-zinc-800 rounded p-3 text-xs overflow-auto max-h-[70vh] whitespace-pre-wrap break-words">{JSON.stringify(resp.json,null,2)}</pre>
      {resp.json?.error && <div className="mt-3 flex flex-wrap gap-2"><span className="bg-red-950 text-red-300 px-2 py-1 rounded border border-red-800 text-xs">Error: {resp.json.error}</span> {['ORG_NOT_VERIFIED','ACCESS_REVOKED','QR_EXPIRED','QR_USED','REQUEST_NOT_APPROVED','RECORD_NOT_OWNED'].includes(resp.json.error) && <span className="text-xs text-zinc-400 bg-zinc-900 px-2 py-1 rounded">Expected for security tests ✓</span>}</div>}
      <button onClick={()=>{navigator.clipboard.writeText(JSON.stringify(resp.json,null,2))}} className="mt-3 text-xs bg-zinc-800 hover:bg-zinc-700 px-3 py-1.5 rounded">Copy JSON</button>
     </>}
    </div>
   </div>
  </div>
  <div className="border-t border-zinc-800 p-2 text-center text-[11px] text-zinc-600 shrink-0">K-ID by Karevo | LAUTECH 2026 | QR: 10min single-use | Revocation invalidates QR immediately</div>
 </div>
)
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body></html>
